name: Benchmarks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/benchmarks.yml"
      - "benchmarks/**"
      - "client-macos/**"
      - "protocol/**"
      - "scripts/**"
      - "server-rust/**"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-driver:
    name: Rust benchmark driver unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test workspace benchmark driver
        run: cargo test --locked --manifest-path server-rust/Cargo.toml -p srui-benchmark-driver

  # Measurements remain opt-in: runner load and display state make hosted PR-run numbers noisy.
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Install Python tooling
        run: uv sync --frozen --extra dev
      - name: Test benchmark harness
        run: uv run --frozen pytest benchmarks/tests
      - name: Run layered benchmark smoke suite
        run: scripts/run-benchmarks --profile smoke --output-dir benchmark-artifacts --timeout 1200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srui-benchmark-report
          path: benchmark-artifacts
