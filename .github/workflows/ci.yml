name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  registry:
    name: Registry Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python tooling
        run: uv sync --extra dev
      - name: Validate protocol/registry.yaml
        run: uv run python protocol/validate_registry.py
      - name: Run registry validator tests
        run: uv run pytest protocol/tests

  rust:
    name: Rust Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build and test server-rust
        run: cargo test -p srui-protocol
        working-directory: server-rust

  swift:
    name: Swift Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test client-macos
        run: swift test
        working-directory: client-macos
      - name: Verify committed Swift protobuf output is fresh
        run: |
          ./protocol/generate_proto.sh
          git diff --exit-code client-macos/Protocol/srui.pb.swift
