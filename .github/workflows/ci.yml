name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  registry:
    name: Registry Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python tooling
        run: uv sync --extra dev
      - name: Validate protocol/registry.yaml
        run: uv run python protocol/validate_registry.py
      - name: Run registry validator tests
        run: uv run pytest protocol/tests

  rust:
    name: Rust Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build and test server-rust workspace
        run: |
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo check --workspace --all-targets
        working-directory: server-rust

  fuzz:
    name: Decoder Fuzz Regression
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seed fuzz corpora from conformance vectors
        run: |
          set -euo pipefail
          vectors="$GITHUB_WORKSPACE/protocol/conformance-vectors"
          fuzz="$GITHUB_WORKSPACE/server-rust/fuzz/corpus"
          mkdir -p "$fuzz/decode_framed" "$fuzz/decode_wire" "$fuzz/apply_transaction"
          cp "$vectors/golden_framed_message.bin" "$fuzz/decode_framed/"
          cp "$vectors/malformed_overlong_varint.bin" "$fuzz/decode_framed/"
          cp "$vectors/malformed_truncated_frame.bin" "$fuzz/decode_framed/"
          cp "$vectors/golden_node_record.bin" "$fuzz/decode_wire/"
          cp "$vectors/golden_transaction.bin" "$fuzz/decode_wire/"
          cp "$vectors/malformed/"*.bin "$fuzz/decode_wire/"
          cp "$vectors/golden_transaction.bin" "$fuzz/apply_transaction/"
          cp "$vectors/malformed/"*.bin "$fuzz/apply_transaction/"
      - name: Run bounded fuzz regression
        working-directory: server-rust/fuzz
        run: |
          set -euo pipefail
          for target in decode_framed decode_wire apply_transaction; do
            cargo fuzz run "$target" "corpus/$target" -- -runs=0
            cargo fuzz run "$target" "corpus/$target" -- -max_total_time=15
          done

  swift:
    name: Swift Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Verify SemanticModel does not import AppKit or Cocoa (§1)
        run: |
          if grep -rnE "^[^/]*import (AppKit|Cocoa)" client-macos/SemanticModel; then
            echo "Error: SemanticModel must never import AppKit or Cocoa"
            exit 1
          fi
      - name: Build and test client-macos
        run: swift test
        working-directory: client-macos
      - name: Verify committed Swift protobuf and registry output is fresh
        run: |
          ./protocol/generate_proto.sh
          git diff --exit-code client-macos/Protocol/srui.pb.swift client-macos/SemanticModel/RegistryTables.swift
