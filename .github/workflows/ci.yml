name: CI

# Runs immediately before merge, not on every push.
#
# The check set is unchanged — the same four jobs run the same commands. What changed is how often
# GitHub pays for them. `synchronize` (every push to an open PR) and `push` (every merge to main,
# re-validating a tree the PR already validated) were the two high-frequency triggers, and neither
# adds signal that `.githooks/pre-push` does not already produce locally on every push.
#
# Workflow:
#   1. open the PR as a draft            -> no runner time
#   2. push freely; `.githooks/pre-push` runs the identical checks locally
#   3. `gh pr ready <n>`                 -> CI runs once, as the merge gate
#
# To re-run after a post-ready fix, without toggling draft state:
#   gh workflow run ci.yml --ref <branch>
on:
  pull_request:
    types: [ready_for_review]
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  registry:
    name: Registry Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python tooling
        run: uv sync --extra dev
      - name: Validate protocol/registry.yaml
        run: uv run python protocol/validate_registry.py
      - name: Run registry validator tests
        run: uv run pytest protocol/tests

  # The server workspace is built and tested on Linux only. It was previously also built on
  # macOS, but that job ran an identical command set at ~10x the per-minute price, and the one
  # platform-specific path in the workspace (`pidfd`, below) is the Linux one. macOS coverage of
  # this code still happens: the `swift` job builds these same crates to run its integration
  # tests against a real `sessiond`.
  rust:
    name: Rust Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build and test server-rust workspace
        run: |
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
        working-directory: server-rust
      # The pidfd termination path is cfg(target_os = "linux") and is the safety-critical remote
      # kill path on the expected server platform, so it must be compiled, linted and tested here.
      - name: Build and test examples
        run: |
          cargo test --manifest-path ../examples/process-monitor/Cargo.toml
          cargo clippy --manifest-path ../examples/process-monitor/Cargo.toml --all-targets -- -D warnings
        working-directory: server-rust

  # libFuzzer and its sanitizers are best supported on Linux, and nothing in the decoders is
  # platform-specific, so this runs where it is cheapest (§26 decode limits are host-independent).
  fuzz:
    name: Decoder Fuzz Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo-fuzz binary and registry
        id: cache-cargo-fuzz
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('server-rust/fuzz/Cargo.lock') }}
          restore-keys: cargo-fuzz-${{ runner.os }}-
      # `restore-keys` can restore an older cache on a key miss (any change to fuzz/Cargo.lock
      # changes the key), which brings back ~/.cargo/bin/cargo-fuzz while `cache-hit` stays false.
      # Gating on the binary itself rather than on an exact cache hit keeps that partial restore
      # from failing the job with "binary `cargo-fuzz` already exists in destination".
      - name: Install cargo-fuzz
        run: |
          set -euo pipefail
          if command -v cargo-fuzz >/dev/null 2>&1; then
            echo "cargo-fuzz already present: $(cargo fuzz --version)"
          else
            cargo install cargo-fuzz --locked
          fi
      - name: Seed fuzz corpora from conformance vectors
        run: |
          set -euo pipefail
          vectors="$GITHUB_WORKSPACE/protocol/conformance-vectors"
          fuzz="$GITHUB_WORKSPACE/server-rust/fuzz/corpus"
          mkdir -p "$fuzz/decode_framed" "$fuzz/decode_wire" "$fuzz/apply_transaction" "$fuzz/state_sequence"
          cp "$vectors/golden_framed_message.bin" "$fuzz/decode_framed/"
          cp "$vectors/malformed_overlong_varint.bin" "$fuzz/decode_framed/"
          cp "$vectors/malformed_truncated_frame.bin" "$fuzz/decode_framed/"
          cp "$vectors/golden_node_record.bin" "$fuzz/decode_wire/"
          cp "$vectors/golden_transaction.bin" "$fuzz/decode_wire/"
          cp "$vectors/malformed/"*.bin "$fuzz/decode_wire/"
          cp "$vectors/golden_transaction.bin" "$fuzz/apply_transaction/"
          cp "$vectors/malformed/"*.bin "$fuzz/apply_transaction/"
          cp "$vectors/golden_transaction.bin" "$fuzz/state_sequence/"
      - name: Run bounded fuzz regression
        working-directory: server-rust/fuzz
        run: |
          set -euo pipefail
          for target in decode_framed decode_wire apply_transaction state_sequence; do
            cargo fuzz run "$target" "corpus/$target" -- -runs=0
            cargo fuzz run "$target" "corpus/$target" -- -max_total_time=15
          done

  swift:
    name: Swift Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build server-rust binaries for integration tests
        run: cargo build --manifest-path server-rust/Cargo.toml
      - name: Build example servers for integration tests
        run: cargo build --manifest-path examples/counter/Cargo.toml
      - name: Verify SemanticModel does not import AppKit or Cocoa (§1)
        run: |
          if grep -rnE "^[^/]*import (AppKit|Cocoa)" client-macos/SemanticModel; then
            echo "Error: SemanticModel must never import AppKit or Cocoa"
            exit 1
          fi
      - name: Build and test client-macos
        run: swift test
        working-directory: client-macos
      - name: Verify committed Swift protobuf and registry output is fresh
        run: |
          ./protocol/generate_proto.sh
          git diff --exit-code client-macos/Protocol/srui.pb.swift client-macos/SemanticModel/RegistryTables.swift
