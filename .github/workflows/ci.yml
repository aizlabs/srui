name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  registry:
    name: Registry Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate protocol/registry.yaml
        run: python3 protocol/validate_registry.py

  rust:
    name: Rust Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build server-rust
        run: cargo build
        working-directory: server-rust

  swift:
    name: Swift Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build client-macos
        run: swift build
        working-directory: client-macos
