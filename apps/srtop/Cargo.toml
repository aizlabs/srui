[package]
name = "srui-process-explorer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
srui-protocol = { path = "../../server-rust/protocol" }
srui-sdk = { path = "../../server-rust/sdk" }
srui-semantic-tree = { path = "../../server-rust/semantic-tree" }
srui-sessiond = { path = "../../server-rust/sessiond" }
srui-unix-security = { path = "../../server-rust/unix-security" }

# PX-008's process-control audit reads the sources as Rust tokens, with the proc-macro2
# version the runtime's macros already lock: no new package, and nothing in the binary.
[dev-dependencies]
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }

[[bin]]
name = "srtop"
path = "src/main.rs"
