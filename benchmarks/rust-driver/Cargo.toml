[package]
name = "srui-benchmark-driver"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
[dependencies]
bytes = "1"
futures = "0.3"
portable-pty = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
srui-protocol = { path = "../../server-rust/protocol" }
srui-pty = { path = "../../server-rust/pty" }
srui-resources = { path = "../../server-rust/resources" }
srui-sdk = { path = "../../server-rust/sdk" }
srui-semantic-tree = { path = "../../server-rust/semantic-tree" }
srui-sessiond = { path = "../../server-rust/sessiond" }
