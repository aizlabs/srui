[package]
name = "srui-example-coding-agent"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
srui-sdk = { path = "../../server-rust/sdk" }
srui-sessiond = { path = "../../server-rust/sessiond" }
srui-protocol = { path = "../../server-rust/protocol" }
srui-semantic-tree = { path = "../../server-rust/semantic-tree" }
srui-pty = { path = "../../server-rust/pty" }

[lib]
name = "srui_example_coding_agent"
path = "src/lib.rs"

[[bin]]
name = "coding-agent-demo"
path = "src/main.rs"
