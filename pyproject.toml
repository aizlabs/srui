[project]
name = "srui-protocol"
version = "0.1.0"
description = "SRUI protocol registry validation tooling"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["protocol", "."]
testpaths = ["protocol/tests", "benchmarks/tests"]
