[workspace]
resolver = "2"
members = [
    "protocol",
    "ssh-bridge",
    "sessiond",
    "semantic-tree",
    "journal",
    "event-dedupe",
    "resources",
    "pty",
    "sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.9"
prost = "0.13"
futures = "0.3"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

