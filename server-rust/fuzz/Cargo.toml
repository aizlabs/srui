[package]
name = "srui-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1.9"
tokio-util = { version = "0.7", features = ["codec"] }
srui-protocol = { path = "../protocol", features = ["async-codec"] }
srui-semantic-tree = { path = "../semantic-tree" }

[[bin]]
name = "decode_framed"
path = "fuzz_targets/decode_framed.rs"
test = false
doc = false

[[bin]]
name = "decode_wire"
path = "fuzz_targets/decode_wire.rs"
test = false
doc = false

[[bin]]
name = "apply_transaction"
path = "fuzz_targets/apply_transaction.rs"
test = false
doc = false

[[bin]]
name = "state_sequence"
path = "fuzz_targets/state_sequence.rs"
test = false
doc = false
